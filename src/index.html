<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Meu Consultório</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Coluna Esquerda: Informações -->
        <aside class="sidebar">
            <div class="logo">
                <h1>🏣 <span>Formulário Silva's Resorts International</span></h2>
            </div>
            
            <div class="welcome-text">
                <h1>Bem-vindo,</h1>
                <p class="subtitle">Seu resort ideal está a apenas um clique !</p>
            </div>

            <p class="footer-text">
                Informe os dados ao lado e desfrute da melhor rede de Resorts internacional.
            </p>
        </aside>

        <!-- Coluna Direita: Formulário -->
        <main class="form-area">
            <header class="form-header">
                <h2>Cadastro</h2>
                <p>Já tem uma conta? <a href="./login_page/login.html">Entre aqui!</a></p>
            </header>

            <form action="./home_screen/index.html" method="GET">
                <!-- Seção 1: Dados Pessoais -->
                <div class="form-section">
                    <h3>Dados Pessoais</h3>
                    
                    <div class="grid-layout">
                        <div class="input-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="ex: Maria Silva" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" placeholder="ex: 111.222.333-44" required>
                        </div>

                        <div class="input-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" placeholder="ex: user@user.com" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" placeholder="••••••" required> 
                        </div>
                    </div>
                </div>

                <!-- Seção 2: Dados Profissionais -->
                <div class="form-section">
                    <h3>INFORMAÇÕES ADICIONAIS</h3>
                    
                    <div class="grid-layout">
                        <div class="input-group">
                            <label for="sigla">País</label>
                            <select id="sigla">
                                <option value="">Selecione seu país</option>
                                <option value="BR">Brasil</option>
                                <option value="PT">Portugal</option>
                                <option value="ES">Espanha</option>
                                <option value="EUA">Estados Unidos</option>
                            </select>
                        </div>
                        
                        <div class="input-group">
                            <label for="genero">GÊNERO</label>
                            <select id="genero">
                                <option value="">Selecione seu gênero</option>
                                <option value="masc">Masculino</option>
                                <option value="fem">Feminino</option>
                                <option value="nt">Neutro</option>
                                <option value="nb">Não-Binário</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="numero_rg">RG</label>
                            <input type="text" id="numero_rg" placeholder="ex: 11.222.333-44">
                        </div>
                        
                        <div class="input-group">
                            <label for="obs">Observação</label>
                            <input type="text" id="obs" placeholder="Informe alguma observação">
                        </div>
                    </div>
                </div>
                <!-- Termos de Aceite -->
                <div class="terms-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Declaro que li e aceito a <a href="#">Política de Privacidade</a>.</label>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-submit">Reservar</button>
                </div>
                
            </form>
        </main>
    </div>

</body>
</html>
