<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha página</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário de cadastro</h1>
    <form action="#" method="post">
    <!--action: define o destino/ URL que
    será alcançado depois do envio do formulário
    method: define o método HTTP de envio-->
    <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="CPF" placeholder="Ex: 222.333.444-55" required>
    </div>
    <div class="form-group">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="age" 
        placeholder="Ex: 14"> 
  
        <label for="datanasc">Data de nascimento:</label>
        <input type="date" id="datanasc" name="Aniversario" 
        required>

        <label for="favcolor">Cor favorita</label>
        <input type="color" id="favcolor" name="Favorita">

        <span class="section-title">Gênero</span>
        <div class="inline-option">
            <input type="radio" id="genero-fem"
            name="Genero" value="Feminino" required>
            <label for="genero-fem">Feminino</label>

            <input type="radio" id="genero-masc"
            name="Genero" value="Masculino" required>
            <label for="genero-masc">Masculino</label>

            <input type="radio" id="genero-outro"
            name="Genero" value="Outro" required>
            <label for="genero-outro">Outro</label>
        </div>

        <span class="section-title">Área de interesse</span>
        <div class="inline-option">
            <input type="checkbox" id="bancodados" 
            name="interesse" value="BancoDados">
            <label for="bancodados">Banco de dados</label>

            <input type="checkbox" id="webdesign" 
            name="interesse" value="WebDesign">
            <label for="webdesign">Web Design</label>

            <input type="checkbox" id="backend" 
            name="interesse" value="Backend">
            <label for="backend">Prog. Backend</label>
        </div>

            <label for="search">Pesquisar informação</label>
            <div class="search-container">
                <input type="search" id="search" name="srch" 
                placeholder="Pesquise aqui...🔍">
            </div>

            <label for="upload">Foto</label>
            <input type="file" id="upload" name="EnviarArquivo">
        </div>
        <button type="submit">Enviar</button>

   
    </form>
</body>
</html>
