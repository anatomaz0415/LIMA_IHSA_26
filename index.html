<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags adicionais - form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exemplos de TAGS adicionais para formulário</h1>
    <form action="#" method="post">
         <!--fiedset: agrupa campos relacionados dentro
        do formulario para organização semântica-->
        <fieldset>
            <!--legend: Fornece um título ou
            descrição para o grupo de campos dentro
            do fieldset-->
            <legend>Informações pessoais</legend>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome"
            placeholder="Ex: Maria Joaquina" required>
            <label for="email">Digite seu e-mail</label>
            <input type="email" id="email" name="email"
            placeholder="exemplo@email.com" required>
        </fieldset>
        <fieldset>
            <legend>Preferências</legend>
            <label for="profissao">Profissão:</label>
            <input list="profissoes" id="profissao" 
            name="profissao" placeholder="Ex: Analista de sistemas"
            required>
            <datalist id="profissoes">
            <!--datalist: lista opções e sugere
            também conforme você digita (autocomplete)-->
                <option value="Programador Front-End">
                <option value="Programador Back-End">
                <option value="Designer">
                <option value="Analista de Banco de Dados">
            </datalist>
            <label for="genero">Gênero</label>
            <select id="genero" name="genero">
                <!--option: opções listadas-->
                <option value="">Selecione..</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
        </fieldset>
        <button type="submit">Enviar</button>

    </form>
</body>
</html>
