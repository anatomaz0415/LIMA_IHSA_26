<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags adicionais forms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario"
        placeholder="Digite seu usuário"
        autocomplete="on">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone"
        title="Seu telefone deve ter 11 dígitos"
        pattern="^(\d{2}\)\S\d{4,5}-\d{4}$" required>
        <!--\d: digito numérico
        {}: quantidade de números ou letras
        ^ : se refere ao que está no início
        da expressão regular
        $ : se refere ao que deve ficar no final
        da expressão
        \S : significa que não pode ter espaço
        {,}: o valor deve estar entre
        -->
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" 
        value="123.456.789-10" readonly>
        <!--readonly: dados inalterados (somente leitura)-->
        <label for="codigo">Código interno:</label>
        <input type="text" id="codigo" name="codigo" value="ADM001" 
        disabled>
        <!--disabled: campo desativado (não pode ser alterado
        nem enviado)-->
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao"
        placeholder="Descreva a função do ex-funcionário"
        rows="10" columns="20" maxlenght="100"></textarea>
        <!--maxlenght: número máximo de caracteres-->
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
